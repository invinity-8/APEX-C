# Guards the automatic database deployment of APEX.
#
# Migrations are applied by the Supabase GitHub integration ("Deploy to production", branch main).
# This workflow makes every problem visible – without any database credential:
#   - pull requests: migration files complete, ordered, no unreviewed destructive SQL, tests, build
#   - push to main:  waits until the live site (Vercel) serves the pushed commit AND the
#                    database reports all migrations, schema version, profiles, Realtime and
#                    no RLS/privilege problems (via the public /api/apex?op=health). Fails clearly otherwise.
#
# Optional repository variable APEX_URL (default https://4pex.online – must not be behind Vercel Authentication).
name: Supabase migrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Migration files are complete and ordered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Migration guard
        run: node scripts/check-migrations.mjs
      - name: Tests (incl. migration ↔ server contract)
        run: npm test
      - name: Type check and build
        run: npm run build

  verify-production:
    name: Production database deployed and secure
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Wait for Vercel + Supabase and verify the live deployment
        env:
          APEX_URL: ${{ vars.APEX_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          WAIT_SECONDS: '900'
        run: node scripts/verify-production.mjs
